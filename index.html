<style>
  :root {
    --page: #eae3f8;
    --cream: #fff1d6;
    --coral: #ff6f59;
    --gold: #ffd166;
    --teal: #3ddbd9;
    --pink: #ff5d8f;
    --cyan: #5ee7ff;
    --orange: #ff9f43;
    --lav: #b892ff;
    --display: 'Unbounded', 'Trebuchet MS', system-ui, sans-serif;
    --body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #150b2b; }
  }
  :root[data-theme="dark"] { --page: #150b2b; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    /* rögzített test: iOS-en nincs "gumiszalag" görgetés, és a biztonságos zónába (bevágás, kezdőképernyő-csík) nem lóg bele semmi */
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    background: var(--page);
    color: var(--cream);
    font-family: var(--body);
    overflow: hidden;
    display: grid;
    place-items: center;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  button { -webkit-appearance: none; appearance: none; touch-action: manipulation; -webkit-touch-callout: none; }

  #stage {
    --u: 1px;
    position: relative;
    font-size: calc(var(--u) * 10);   /* 1em = 10 logikai pixel */
    background: #1d0f3f;
    overflow: hidden;
    touch-action: none;                /* sehol nincs görgetés */
    border-radius: 1.6em;
    box-shadow: 0 1em 4em rgba(20, 8, 40, .35);
  }
  #stage.playing { cursor: none; touch-action: none; }
  @media (max-width: 560px) { #stage { border-radius: 0; box-shadow: none; } }
  /* érintőképernyőn a játéktér körüli sáv (bevágás, állapotsor, kezdőképernyő-csík) is sötét, hogy egybeolvadjon */
  @media (pointer: coarse) {
    body { background: linear-gradient(180deg, #1d0f3f, #12204a); }
    #stage { box-shadow: none; }
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; -ms-touch-action: none; }
  #hud, #screen, #langBar { -webkit-tap-highlight-color: transparent; }

  /* ---------- HUD ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  .hud-top { position: absolute; top: 1.4em; left: 1.6em; right: 1.6em; display: flex; justify-content: space-between; align-items: flex-start; }
  #score { font-family: var(--display); font-weight: 800; font-size: 3em; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 .08em 0 rgba(255, 111, 89, .55); }
  #best { font-size: 1.3em; font-weight: 700; opacity: .65; margin-top: .5em; }
  #waveLabel {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    font-family: var(--display); font-weight: 500; font-size: 1.25em; white-space: nowrap;
    padding: .6em 1.1em; border-radius: 99em; background: rgba(255, 241, 214, .12);
  }
  .btns { display: flex; gap: .8em; }
  #stage.paused .btns, #stage.paused #waveLabel, #stage.paused #banner { visibility: hidden; }   /* szünetben a nyelvválasztó foglalja a jobb felső sarkot */
  .icon-btn {
    pointer-events: auto; width: 3.8em; height: 3.8em; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255, 241, 214, .13); color: var(--cream); display: grid; place-items: center;
  }
  @media (hover: hover) { .icon-btn:hover { background: rgba(255, 241, 214, .24); } }
  .icon-btn svg { width: 1.8em; height: 1.8em; }
  button:focus-visible { outline: .3em solid var(--cream); outline-offset: .3em; }

  /* Telefon: szöveg + gombok +20% (a játékméret változatlan) */

  /* ---------- Nyelvválasztó (csak menüben és szünetben látszik) ---------- */

<body>
<div id="stage">
  <canvas id="c" data-i18n-aria="canvasLabel" aria-label="Nova játéktér"></canvas>

  <div id="hud" hidden>
    <div class="hud-top">

      </div>

        </button>
      </div>

        </div>
        <div id="weapon"><span id="weaponTxt">Fegyver 1</span><div id="pips"><i></i><i></i><i></i><i></i></div></div>

      </div>

    </button>

<script>
(() => {
'use strict';

/* =====================================================================
   Segédfüggvények
   ===================================================================== */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(Math.random() * a.length)];
const $ = s => document.querySelector(s);
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
const fmt = n => Math.round(n).toLocaleString(LOCALES[lang] || 'hu-HU');
const mmss = s => { s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const TOUCH = !!(window.matchMedia && (
  matchMedia('(hover: none) and (pointer: coarse)').matches ||
  matchMedia('(pointer: coarse)').matches ||
  ('ontouchstart' in window) ||
  (navigator.maxTouchPoints > 0)
));
const NARROW = !!(window.matchMedia && matchMedia('(max-width: 700px)').matches);
try {
  if (TOUCH) document.documentElement.classList.add('touch');
  if (NARROW) document.documentElement.classList.add('narrow');

/* =====================================================================
   Tárolás (rekord, statisztika) – localStorage + memória tartalék
   ===================================================================== */
const _mem = Object.create(null);
const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem('nova:' + k);
      if (v !== null) {
        const p = JSON.parse(v);
        _mem[k] = p;
        return p;
      }
    } catch (e) {}
    // régi kulcs migrálása
    try {
      const old = localStorage.getItem('csillagpor:' + k);
      if (old !== null) {
        const p = JSON.parse(old);
        _mem[k] = p;
        try { localStorage.setItem('nova:' + k, old); } catch (e2) {}
        return p;
      }
    } catch (e) {}
    return (k in _mem) ? _mem[k] : d;
  },
  set(k, v) {
    _mem[k] = v;
    try { localStorage.setItem('nova:' + k, JSON.stringify(v)); } catch (e) {}
  }
};

let selectedSkin = Number(store.get('skin', 0)) || 0;
if (!SKINS[selectedSkin]) selectedSkin = 0;

function currentSkin() { return SKINS[selectedSkin] || SKINS[0]; }
function getBest() {
  const v = Number(store.get('best', 0));
  return Number.isFinite(v) && v > 0 ? Math.floor(v) : 0;
}
function saveBest(score) {
  const s = Math.floor(Number(score) || 0);
  const prev = getBest();
  if (s > prev) {
    store.set('best', s);
    return s;
  }
  return prev;
}
function skinUnlocked(id) {
  id = Number(id);
  const sk = SKINS[id];
  if (!sk) return false;
  return getBest() >= sk.cost;
}
function selectSkin(id) {
  id = Number(id);
  if (!skinUnlocked(id)) return false;
  selectedSkin = id;
  store.set('skin', id);
  return true;
}
function skinProgressHTML() {
  const best = getBest();
  const names = t('skinNames');
  const unlocked = SKINS.filter(sk => best >= sk.cost).length;
  const next = SKINS.find(sk => sk.cost > best);
  let html = `<div class="rank">${t('savedRecord', fmt(best))}</div>`;
  html += `<div class="rank">${unlocked}/${SKINS.length} — ${t('skins')}</div>`;
  if (next) html += `<div class="rank">${t('nextSkin', names[next.id] || next.id, fmt(next.cost))}</div>`;
  else html += `<div class="rank">${t('allSkins')}</div>`;
  return html;
}

/* =====================================================================
   Hang (WebAudio szintetizátor, külső fájlok nélkül)
   ===================================================================== */
const Sound = {
  ctx: null, master: null, noiseBuf: null, last: {}, muted: store.get('muted', false),
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  resume() {
    if (!this.ctx || this.ctx.state === 'running') return;
    try { const p = this.ctx.resume(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  },
  ok() { return this.ctx && !this.muted; },
  throttle(name, ms) { const n = performance.now(); if (n - (this.last[name] || 0) < ms) return false; this.last[name] = n; return true; },
  tone({ f = 440, f2 = null, dur = 0.1, type = 'square', vol = 0.1, delay = 0 }) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.03);
  },
  noise({ dur = 0.3, vol = 0.2, freq = 1200, delay = 0 }) {
    if (!this.ok()) return;
    const c = this.ctx, t = c.currentTime + delay;
    if (!this.noiseBuf) {
      const len = Math.floor(c.sampleRate * 1.6);
      const b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = b;
    }
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(Math.max(200, freq), t);
    f.frequency.exponentialRampToValueAtTime(90, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.03);
  },
  arp(notes, type = 'triangle', vol = 0.09, step = 0.07) { notes.forEach((f, i) => this.tone({ f, dur: 0.14, type, vol, delay: i * step })); },
  shoot() { if (this.throttle('shoot', 70)) this.tone({ f: 920, f2: 380, dur: 0.08, type: 'square', vol: 0.03 }); },
  eshoot() { if (this.throttle('eshoot', 90)) this.tone({ f: 320, f2: 170, dur: 0.14, type: 'sawtooth', vol: 0.035 }); },
  hit() { if (this.throttle('hit', 45)) this.tone({ f: 240, f2: 110, dur: 0.05, type: 'triangle', vol: 0.07 }); },
  boom(l) { this.noise({ dur: 0.25 + l * 0.18, vol: 0.2 + l * 0.06, freq: 1800 - l * 450 }); this.tone({ f: 130, f2: 38, dur: 0.3 + l * 0.15, type: 'sawtooth', vol: 0.1 }); },
  dust(p) { this.tone({ f: 640 + p * 65, dur: 0.07, type: 'sine', vol: 0.06 }); },
  graze() { if (this.throttle('graze', 60)) this.tone({ f: 1500, dur: 0.03, type: 'sine', vol: 0.025 }); },
  pickup() { this.arp([523, 659, 784, 1046], 'triangle', 0.09, 0.055); },
  levelUp() { this.arp([392, 523, 659, 784, 1046], 'square', 0.05, 0.06); },
  hurt() { this.noise({ dur: 0.5, vol: 0.28, freq: 2200 }); this.tone({ f: 300, f2: 60, dur: 0.45, type: 'sawtooth', vol: 0.14 }); },
  shieldHit() { this.tone({ f: 700, f2: 1300, dur: 0.12, type: 'sine', vol: 0.1 }); },
  bomb() { this.noise({ dur: 1.1, vol: 0.34, freq: 3000 }); this.tone({ f: 90, f2: 30, dur: 0.9, type: 'sawtooth', vol: 0.18 }); },
  wave() { this.arp([330, 440, 554], 'triangle', 0.08, 0.09); },
  boss() { this.tone({ f: 70, f2: 55, dur: 1.2, type: 'sawtooth', vol: 0.14 }); this.tone({ f: 73, f2: 58, dur: 1.2, type: 'square', vol: 0.05 }); },
  over() { this.arp([392, 330, 262, 196], 'sawtooth', 0.07, 0.16); },
  ui() { this.tone({ f: 660, f2: 990, dur: 0.06, type: 'sine', vol: 0.07 }); }
};

const stage = $('#stage'), canvas = $('#c'), ctx = canvas.getContext('2d');

const W = 480;

/* Biztonságos zóna (bevágás, kezdőképernyő-csík) mérése egy rejtett próbaelemmel */
const probe = document.createElement('div');
probe.setAttribute('aria-hidden', 'true');
probe.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
document.body.appendChild(probe);

function resize() {
  const ps = getComputedStyle(probe);
  const insetX = (parseFloat(ps.paddingLeft) || 0) + (parseFloat(ps.paddingRight) || 0);
  const insetY = (parseFloat(ps.paddingTop) || 0) + (parseFloat(ps.paddingBottom) || 0);
  const aw = (document.body.clientWidth || window.innerWidth) - insetX;
  const ah = (document.body.clientHeight || window.innerHeight) - insetY;
  if (aw < 50 || ah < 50) return;
  H = clamp(Math.round(W * ah / aw), 640, 960);
  const scale = Math.min(aw / W, ah / H);
  const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
  if (stage.style.width !== cw + 'px') stage.style.width = cw + 'px';
  if (stage.style.height !== ch + 'px') stage.style.height = ch + 'px';
  stage.style.setProperty('--u', scale + 'px');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const pw = Math.floor(cw * dpr), ph = Math.floor(ch * dpr);
  // iOS-en a vászon minden újraméretezése memóriát foglal, ezért csak tényleges változáskor írjuk át
  if (canvas.width !== pw) canvas.width = pw;
  if (canvas.height !== ph) canvas.height = ph;
  if (P) { P.x = clamp(P.x, 18, W - 18); P.y = clamp(P.y, 60, H - 92); }
}
let resizeRaf = 0;
function scheduleResize() {
  if (resizeRaf) return;
  resizeRaf = requestAnimationFrame(() => { resizeRaf = 0; resize(); });
}

/* =====================================================================
   Háttér: színátmenet, ködök, háromrétegű csillagok, hulló csillag
   ===================================================================== */
const layers = [
  { n: 44, speed: 14, size: 1.1, alpha: 0.35 },
  { n: 30, speed: 34, size: 1.5, alpha: 0.55 },
  { n: 16, speed: 76, size: 2.1, alpha: 0.9 }
];
const stars = [];
for (const L of layers) for (let i = 0; i < L.n; i++) stars.push({ x: rand(0, W), y: rand(0, 960), L, tw: rand(0, TAU) });
const blobs = [
  { x: 120, y: 150, r: 230, c: '#6a3fd6', a: 0.3, v: 7 },
  { x: 400, y: 430, r: 210, c: '#ff5d8f', a: 0.16, v: 9 },
  { x: 160, y: 720, r: 250, c: '#2bb5c9', a: 0.16, v: 6 },
  { x: 380, y: -60, r: 200, c: '#8a4bff', a: 0.22, v: 8 }
];
let streak = null, streakT = 3;

function updateBackground(dt) {
  const boost = 1 + G.warp * 9;
  for (const s of stars) {
    s.y += s.L.speed * dt * boost;
    if (s.y > H) { s.y %= H; s.x = rand(0, W); }
  }
  for (const b of blobs) {
    b.y += b.v * dt * (1 + G.warp * 3);
    if (b.y - b.r > H) { b.y = -b.r; b.x = rand(60, W - 60); }
  }
  streakT -= dt;
  if (streakT <= 0 && !streak) { streak = { x: rand(120, W), y: rand(-20, H * 0.3), life: 0.8, t: 0 }; streakT = rand(5, 10); }
  if (streak) { streak.t += dt; streak.x -= 420 * dt; streak.y += 270 * dt; if (streak.t > streak.life) streak = null; }
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1d0f3f'); g.addColorStop(0.55, '#251456'); g.addColorStop(1, '#12204a');
  ctx.fillStyle = g;
  ctx.fillRect(-30, -30, W + 60, H + 60);
  ctx.globalCompositeOperation = 'lighter';
  for (const b of blobs) drawGlow(b.x, b.y, b.r, b.c, b.a);
  ctx.globalCompositeOperation = 'source-over';
  for (const s of stars) {
    const tw = 0.7 + 0.3 * Math.sin(clock * 2.2 + s.tw);
    ctx.fillStyle = rgba(C.cream, s.L.alpha * tw);
    const len = s.L.size + (s.L === layers[2] ? G.warp * 22 : s.L === layers[1] ? G.warp * 9 : 0);
    ctx.fillRect(s.x, s.y, s.L.size, len);
  }
  if (streak) {
    const a = 1 - streak.t / streak.life;
    const grd = ctx.createLinearGradient(streak.x, streak.y, streak.x + 90, streak.y - 58);
    grd.addColorStop(0, rgba(C.cream, a)); grd.addColorStop(1, rgba(C.cream, 0));
    ctx.strokeStyle = grd; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(streak.x, streak.y); ctx.lineTo(streak.x + 90, streak.y - 58); ctx.stroke();
  }
}

/* =====================================================================
   Grafikai segédek
   ===================================================================== */
const glowCache = {};
function glow(color) {
  if (glowCache[color]) return glowCache[color];
  const s = 128, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'), r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  r.addColorStop(0, rgba(color, 1)); r.addColorStop(0.25, rgba(color, 0.55)); r.addColorStop(0.6, rgba(color, 0.12)); r.addColorStop(1, rgba(color, 0));
  g.fillStyle = r; g.fillRect(0, 0, s, s);
  return (glowCache[color] = c);
}
function drawGlow(x, y, r, color, alpha = 1) {
  const prev = ctx.globalAlpha;
  ctx.globalAlpha = prev * alpha;
  ctx.drawImage(glow(color), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = prev;
}
function poly(n, r, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) { const a = rot + (i / n) * TAU; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath();
}
function star4(x, y, r, rot, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = color; ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * 0.35 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

/* =====================================================================
   Effektek: részecskék, hullámgyűrűk, pontfelugrók
   ===================================================================== */
const MAXP = 700;
function burst(x, y, n, color, speed = 150, life = 0.6, size = 3) {
  for (let i = 0; i < n; i++) {
    if (particles.length > MAXP) return;
    const a = rand(0, TAU), s = rand(speed * 0.2, speed);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(life * 0.5, life), max: life, size: rand(size * 0.5, size), color, drag: 2.2 });
  }
}
function explode(x, y, s, c1 = C.gold, c2 = C.coral) {
  burst(x, y, Math.round(s * 0.9), c1, s * 7, 0.7, 3.2);
  burst(x, y, Math.round(s * 0.6), c2, s * 4.5, 0.9, 4);
  burst(x, y, Math.round(s * 0.25), '#ffffff', s * 9, 0.4, 2);
  rings.push({ x, y, r: s * 0.3, max: s * 2.6, life: 0.45, t: 0, color: c1, lw: 3 });
  particles.push({ x, y, vx: 0, vy: 0, life: 0.22, max: 0.22, size: s * 0.8, color: '#ffffff', drag: 0 });
  addShake(s * 0.3);
}
function popup(x, y, text, color = C.cream, size = 13) { popups.push({ x, y, text, color, size, t: 0, life: 0.95 }); }

function updateFx(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    const d = Math.max(0, 1 - p.drag * dt);
    p.vx *= d; p.vy *= d; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = rings.length - 1; i >= 0; i--) { rings[i].t += dt; if (rings[i].t >= rings[i].life) rings.splice(i, 1); }
  for (let i = popups.length - 1; i >= 0; i--) { const p = popups[i]; p.t += dt; p.y -= 26 * dt; if (p.t >= p.life) popups.splice(i, 1); }
  for (let i = timers.length - 1; i >= 0; i--) { timers[i].t -= dt; if (timers[i].t <= 0) { const f = timers[i].fn; timers.splice(i, 1); f(); } }
  G.shake = Math.max(0, G.shake - dt * 38);
  G.flash = Math.max(0, G.flash - dt * 1.8);
  G.warp = Math.max(0, G.warp - dt * 1.3);
  if (G.bombFx) { G.bombFx.t += dt; if (G.bombFx.t > G.bombFx.dur) G.bombFx = null; }
}

/* =====================================================================
   Pontozás és kombó
   ===================================================================== */
function addScore(n, useMult = true) { const v = Math.round(n * (useMult ? G.mult : 1)); G.score += v; return v; }
function addKillCombo() {
  G.comboCount++; G.comboTimer = 2.4;
  G.mult = Math.min(8, 1 + Math.floor(G.comboCount / 4));
  G.maxMult = Math.max(G.maxMult, G.mult);
  G.maxCombo = Math.max(G.maxCombo, G.comboCount);
}
function resetCombo() { G.comboCount = 0; G.mult = 1; G.comboTimer = 0; }

/* =====================================================================
   Hullámok
   ===================================================================== */
const hint = n => (n === 4 ? t(TOUCH ? 'hint4t' : 'hint4') : t('hint' + n)) || '';

function buildWave(n) {
  const q = [];
  if (n % 5 === 0) { q.push({ t: 2.2, type: 'boss', variant: Math.floor(n / 5) }); return q; }
  let t = 1.6, used = 0;
  const budget = 6 + Math.floor(n * 2.3);
  const gap = () => rand(0.55, 1.2) * Math.max(0.55, 1 - n * 0.03);
  while (used < budget) {
    const r = Math.random();
    if (n >= 7 && r < 0.08) {
      q.push({ t, type: 'seeker', x: rand(60, W - 60) }); used += 3; t += gap() + 0.5;
    } else if (n >= 5 && r < 0.16) {
      q.push({ t, type: 'heavy', x: rand(80, W - 80) }); used += 3; t += gap() + 0.7;
    } else if (n >= 4 && r < 0.24) {
      q.push({ t, type: 'scout', x: rand(50, W - 50) }); used += 1; t += gap() * 0.7;
    } else if (n >= 6 && r < 0.32) {
      const bx = rand(100, W - 100);
      for (let i = 0; i < 3; i++) q.push({ t: t + i * 0.28, type: 'crystal', x: bx + (i - 1) * 40 });
      used += 3; t += 0.9 + gap();
    } else if (n >= 3 && r < 0.42) {
      q.push({ t, type: 'shooter', x: rand(90, W - 90) }); used += 3; t += gap() + 0.6;
    } else if (n >= 2 && r < 0.58) {
      const size = (n >= 6 && Math.random() < 0.4) || Math.random() < 0.5 ? 3 : 2;
      q.push({ t, type: 'asteroid', size, x: rand(40, W - 40) }); used += size === 3 ? 2 : 1; t += gap();
    } else if (n >= 2 && r < 0.72) {
      const bx = rand(110, W - 110), cnt = 4 + (n > 6 ? 1 : 0);
      for (let i = 0; i < cnt; i++) q.push({ t: t + i * 0.34, type: 'drone', x: bx, amp: 62, freq: 1.7, phase: -i * 0.55 });
      used += cnt; t += cnt * 0.34 + gap();
    } else {
      q.push({ t, type: 'drone', x: rand(40, W - 40) }); used += 1; t += gap();
    }
  }
  return q.sort((a, b) => a.t - b.t);
}

function startWave(n) {
  G.wave = n; G.waveClock = 0; G.queue = buildWave(n); G.cleared = false; G.hitThisWave = false; G.warp = 1;
  const boss = n % 5 === 0;
  const bossIdx = Math.floor(n / 5);
  const bossName = boss ? (t('bossNames')[((bossIdx - 1) % 5)] || t('boss')) : '';
  showBanner(boss ? t('warning') : t('wave', n), boss ? bossName + ' — ' + t('bossComing') : hint(n));
  if (boss) Sound.boss(); else Sound.wave();
}

function updateWave(dt) {
  if (G.state !== 'play') return;
  if (G.waveDelay > 0) { G.waveDelay -= dt; if (G.waveDelay <= 0) startWave(G.wave + 1); return; }
  G.waveClock += dt;
  while (G.queue.length && G.queue[0].t <= G.waveClock) {
    const q = G.queue.shift();
    if (q.type === 'boss') { spawnEnemy('boss', { x: W / 2, y: -90 }); } else spawnEnemy(q.type, q);
  }
  if (!G.queue.length && enemies.length === 0 && !G.cleared) waveCleared();
}

function waveCleared() {
  G.cleared = true;
  const perfect = !G.hitThisWave;
  const bonus = G.wave * 100 + (perfect ? 500 : 0);
  addScore(bonus, false);
  showBanner(t('waveDone'), (perfect ? t('flawless') : '') + t('points', fmt(bonus)));
  G.waveDelay = 2.8;
  Sound.pickup();
}

/* =====================================================================
   Ellenségek
   ===================================================================== */
function spawnEnemy(type, o = {}) {
  const n = G.wave;
  const e = { type, t: 0, flash: 0, dead: false, x: o.x !== undefined ? o.x : W / 2, y: o.y !== undefined ? o.y : -40, r: 14, hp: 1, score: 50 };
  if (type === 'drone') {
    Object.assign(e, { r: 15, hp: 2 + Math.floor(n / 4), score: 100, vy: Math.min(150, 68 + n * 4), baseX: e.x, amp: o.amp !== undefined ? o.amp : rand(25, 85), freq: o.freq !== undefined ? o.freq : rand(1.1, 2), phase: o.phase !== undefined ? o.phase : rand(0, TAU), fireT: n >= 4 ? rand(1, 3.2) : Infinity });
  } else if (type === 'asteroid') {
    const size = o.size || 3;
    const rr = [0, 13, 22, 35][size];
    const pts = [], N = 9 + Math.floor(Math.random() * 3);
    for (let i = 0; i < N; i++) pts.push({ a: (i / N) * TAU, r: rr * rand(0.78, 1.06) });
    const craters = [];
    for (let i = 0; i < 2 + size; i++) craters.push({ x: rand(-rr * 0.5, rr * 0.5), y: rand(-rr * 0.5, rr * 0.5), r: rand(rr * 0.1, rr * 0.22) });
    Object.assign(e, { size, r: rr, hp: [0, 1, 3, 7][size] + (size > 1 ? Math.floor(n / 6) : 0), score: [0, 30, 60, 120][size], vx: o.vx !== undefined ? o.vx : rand(-35, 35), vy: o.vy !== undefined ? o.vy : rand(55, 105) + n * 2, rot: rand(0, TAU), spin: rand(-1.8, 1.8), pts, craters });
  } else if (type === 'shooter') {
    Object.assign(e, { r: 18, hp: 5 + Math.floor(n / 3), score: 250, mode: 'enter', targetY: rand(80, 200), baseX: e.x, phase: rand(0, TAU), stay: rand(8, 12), fireT: 1.3, charge: false });
  } else if (type === 'scout') {
    Object.assign(e, { r: 11, hp: 1 + Math.floor(n / 8), score: 80, vy: Math.min(220, 140 + n * 6), baseX: e.x, amp: rand(40, 100), freq: rand(2.5, 4), phase: rand(0, TAU) });
  } else if (type === 'heavy') {
    Object.assign(e, { r: 28, hp: 12 + Math.floor(n / 2), score: 350, vy: Math.min(70, 35 + n * 1.5), fireT: rand(1.5, 2.8), baseX: e.x });
  } else if (type === 'seeker') {
    Object.assign(e, { r: 16, hp: 6 + Math.floor(n / 3), score: 280, speed: Math.min(95, 45 + n * 2.5), fireT: rand(1.8, 3) });
  } else if (type === 'crystal') {
    Object.assign(e, { r: 14, hp: 3 + Math.floor(n / 5), score: 150, vy: Math.min(120, 55 + n * 3), rot: rand(0, TAU), spin: rand(1.5, 3.5) * (Math.random() < 0.5 ? 1 : -1), fireT: rand(1.2, 2.5) });
  } else if (type === 'boss') {
    const k = Math.max(1, o.variant || Math.floor(n / 5) || 1);
    const variant = ((k - 1) % 5) + 1; // 1..5 repeating, scaled by k
    const hp = 200 + 130 * (k - 1);
    Object.assign(e, {
      r: variant === 2 ? 52 : variant === 4 ? 55 : 60,
      hp, maxhp: hp, score: 3000 * k, mode: 'enter', phase: 0,
      variant, fanT: 1.5, spinT: 0, spin: 0, sumT: 4, beamT: 3, mineT: 2.5, orbT: 2
    });
    G.bossRef = e;
  }
  enemies.push(e);
  return e;
}

const aim = (x, y) => Math.atan2(P.y - y, P.x - x);
const speedMul = () => 1 + Math.min(1, G.wave / 24) * 0.4;
function enemyShot(x, y, ang, sp, r = 5) { eBullets.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r, grazed: false }); Sound.eshoot(); }

function updateEnemies(dt) {
  const sp = speedMul();
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.dead) continue;
    e.t += dt;
    if (e.flash > 0) e.flash -= dt;

    if (e.type === 'drone') {
      e.y += e.vy * dt;
      e.x = e.baseX + Math.sin(e.t * e.freq + e.phase) * e.amp;
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > 0 && e.y < H * 0.65) { e.fireT = rand(2.2, 3.8); enemyShot(e.x, e.y + e.r, Math.PI / 2, 190 * sp); }
      if (e.y > H + 40) e.dead = true;
    } else if (e.type === 'asteroid') {
      e.x += e.vx * dt; e.y += e.vy * dt; e.rot += e.spin * dt;
      if (e.y > H + 80 || e.x < -90 || e.x > W + 90) e.dead = true;
    } else if (e.type === 'shooter') {
      if (e.mode === 'enter') {
        e.y += 120 * dt;
        if (e.y >= e.targetY) e.mode = 'hover';
      } else if (e.mode === 'hover') {
        e.x = e.baseX + Math.sin(e.t * 0.9 + e.phase) * 70;
        e.y = e.targetY + Math.sin(e.t * 1.7) * 8;
        e.fireT -= dt; e.stay -= dt;
        e.charge = e.fireT < 0.4;
        if (e.fireT <= 0) {
          const a = aim(e.x, e.y);
          if (G.wave < 6) enemyShot(e.x, e.y + 10, a, 210 * sp);
          else for (let k = -1; k <= 1; k++) enemyShot(e.x, e.y + 10, a + k * 0.22, 210 * sp);
          e.fireT = 2.2 - Math.min(1, G.wave / 24) * 0.7; e.charge = false;
        }
        if (e.stay <= 0) e.mode = 'leave';
      } else { e.y += 140 * dt; e.charge = false; }
      if (e.y > H + 40) e.dead = true;
    } else if (e.type === 'scout') {
      e.y += e.vy * dt;
      e.x = e.baseX + Math.sin(e.t * e.freq + e.phase) * e.amp;
      if (e.y > H + 40) e.dead = true;
    } else if (e.type === 'heavy') {
      e.y += e.vy * dt;
      e.x = e.baseX + Math.sin(e.t * 0.5) * 20;
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > 20 && e.y < H * 0.7) {
        e.fireT = rand(2.0, 3.2);
        for (let k = -1; k <= 1; k++) enemyShot(e.x, e.y + e.r, Math.PI / 2 + k * 0.18, 160 * sp, 7);
      }
      if (e.y > H + 50) e.dead = true;
    } else if (e.type === 'seeker') {
      const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
      e.x += (dx / d) * e.speed * dt;
      e.y += (dy / d) * e.speed * 0.7 * dt + 25 * dt;
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > 0 && e.y < H * 0.75) {
        e.fireT = rand(2.2, 3.5);
        enemyShot(e.x, e.y, aim(e.x, e.y), 180 * sp, 5);
      }
      if (e.y > H + 40) e.dead = true;
    } else if (e.type === 'crystal') {
      e.y += e.vy * dt;
      e.rot += e.spin * dt;
      e.fireT -= dt;
      if (e.fireT <= 0 && e.y > 30 && e.y < H * 0.6) {
        e.fireT = rand(1.8, 3);
        enemyShot(e.x, e.y, Math.PI / 2 + 0.55, 200 * sp, 4);
        enemyShot(e.x, e.y, Math.PI / 2 - 0.55, 200 * sp, 4);
      }
      if (e.y > H + 40) e.dead = true;
    } else if (e.type === 'boss') {
      if (e.mode === 'enter') {
        e.y += 60 * dt;
        if (e.y >= 130) { e.mode = 'fight'; e.y = 130; }
        continue;
      }
      const v = e.variant || 1;
      e.x = W / 2 + Math.sin(e.t * (v === 3 ? 1.1 : 0.6)) * (W / 2 - (v === 2 ? 80 : 100));
      e.y = 130 + Math.sin(e.t * 1.1) * 14;
      const ratio = e.hp / e.maxhp;
      const ph = ratio > 0.66 ? 1 : ratio > 0.33 ? 2 : 3;
      if (ph !== e.phase) {
        if (e.phase) {
          G.flash = 0.5; G.flashColor = '#ffffff'; addShake(16); Sound.boom(2);
          popup(e.x, e.y + 70, t('newPhase'), C.gold, 16);
          bulletsToDust(24);
        }
        e.phase = ph;
      }
      // --- Boss variant attack patterns ---
      if (v === 1) {
        // Classic mothership: fan + spin + summons
        e.fanT -= dt;
        if (e.fanT <= 0) {
          e.fanT = ph === 1 ? 1.25 : ph === 2 ? 1.7 : 1.45;
          const a = aim(e.x, e.y + 40);
          for (let k = -2; k <= 2; k++) enemyShot(e.x, e.y + 40, a + k * 0.22, 225 * sp, 6);
        }
        if (ph >= 2) {
          e.spinT -= dt;
          if (e.spinT <= 0) {
            e.spinT = ph === 2 ? 0.17 : 0.12; e.spin += 0.55;
            enemyShot(e.x, e.y, e.spin, 150 * sp); enemyShot(e.x, e.y, e.spin + Math.PI, 150 * sp);
          }
        }
        if (ph === 3) {
          e.sumT -= dt;
          if (e.sumT <= 0) {
            e.sumT = 6;
            spawnEnemy('drone', { x: 70, y: -30, amp: 30 }); spawnEnemy('drone', { x: W - 70, y: -30, amp: 30 });
          }
        }
      } else if (v === 2) {
        // Twin Core: dual side cannons + ring shots
        e.fanT -= dt;
        if (e.fanT <= 0) {
          e.fanT = ph === 1 ? 0.9 : 0.7;
          for (const sx of [-1, 1]) {
            const a = aim(e.x + sx * 40, e.y + 20);
            enemyShot(e.x + sx * 40, e.y + 20, a, 210 * sp, 5);
            if (ph >= 2) enemyShot(e.x + sx * 40, e.y + 20, a + 0.3 * sx, 200 * sp, 5);
          }
        }
        if (ph >= 2) {
          e.spinT -= dt;
          if (e.spinT <= 0) {
            e.spinT = 0.4; e.spin += 0.4;
            for (let k = 0; k < 8; k++) enemyShot(e.x, e.y, e.spin + k * TAU / 8, 130 * sp, 4);
          }
        }
        if (ph === 3) {
          e.sumT -= dt;
          if (e.sumT <= 0) {
            e.sumT = 5;
            spawnEnemy('scout', { x: 80, y: -20 }); spawnEnemy('scout', { x: W - 80, y: -20 });
          }
        }
      } else if (v === 3) {
        // Spin Fortress: heavy spiral + mines
        e.spinT -= dt;
        if (e.spinT <= 0) {
          e.spinT = ph === 1 ? 0.14 : 0.1; e.spin += 0.48;
          enemyShot(e.x, e.y, e.spin, 160 * sp, 5);
          enemyShot(e.x, e.y, e.spin + Math.PI / 2, 160 * sp, 5);
          enemyShot(e.x, e.y, e.spin + Math.PI, 160 * sp, 5);
          enemyShot(e.x, e.y, e.spin + Math.PI * 1.5, 160 * sp, 5);
        }
        e.mineT -= dt;
        if (e.mineT <= 0) {
          e.mineT = ph === 3 ? 1.8 : 2.8;
          for (let k = -2; k <= 2; k++) enemyShot(e.x + k * 35, e.y + 30, Math.PI / 2, 90 * sp, 8);
        }
        if (ph === 3) {
          e.sumT -= dt;
          if (e.sumT <= 0) {
            e.sumT = 7;
            spawnEnemy('crystal', { x: rand(60, W - 60), y: -30 });
          }
        }
      } else if (v === 4) {
        // Beam Lancer: aimed beams + burst
        e.beamT -= dt;
        if (e.beamT <= 0) {
          e.beamT = ph === 1 ? 2.2 : ph === 2 ? 1.7 : 1.3;
          const a = aim(e.x, e.y + 30);
          for (let k = 0; k < (ph === 3 ? 7 : 5); k++) {
            after(k * 0.06, () => { if (!e.dead) enemyShot(e.x, e.y + 30, a, 280 * sp, 4); });
          }
        }
        e.fanT -= dt;
        if (e.fanT <= 0) {
          e.fanT = 1.8;
          for (let k = -3; k <= 3; k++) enemyShot(e.x, e.y + 20, Math.PI / 2 + k * 0.28, 170 * sp, 5);
        }
        if (ph >= 2) {
          e.spinT -= dt;
          if (e.spinT <= 0) {
            e.spinT = 0.55;
            const a = aim(e.x, e.y);
            for (let k = -1; k <= 1; k++) enemyShot(e.x, e.y, a + k * 0.35, 200 * sp, 6);
          }
        }
      } else {
        // Swarm Queen (v5+): summons + wide fans
        e.fanT -= dt;
        if (e.fanT <= 0) {
          e.fanT = ph === 1 ? 1.4 : 1.1;
          const a = aim(e.x, e.y + 40);
          for (let k = -3; k <= 3; k++) enemyShot(e.x, e.y + 40, a + k * 0.18, 210 * sp, 5);
        }
        e.sumT -= dt;
        if (e.sumT <= 0) {
          e.sumT = ph === 3 ? 3.5 : 5;
          const types = ['drone', 'scout', 'crystal'];
          const ty = pick(types);
          spawnEnemy(ty, { x: rand(50, W - 50), y: -25 });
          if (ph >= 2) spawnEnemy(ty, { x: rand(50, W - 50), y: -40 });
        }
        if (ph === 3) {
          e.orbT -= dt;
          if (e.orbT <= 0) {
            e.orbT = 2.2; e.spin += 0.7;
            for (let k = 0; k < 6; k++) enemyShot(e.x, e.y, e.spin + k * TAU / 6, 140 * sp, 5);
          }
        }
      }
    }
  }
}

function bulletsToDust(max) {
  let n = 0;
  for (const b of eBullets) {
    burst(b.x, b.y, 3, C.pink, 80, 0.4, 2);
    if (n < max) { pickups.push(newDust(b.x, b.y)); n++; }
  }
  eBullets = [];
}

/* =====================================================================
   Sebzés, halál, zsákmány
   ===================================================================== */
function hitEnemy(e, dmg, x, y) {
  if (e.dead || (e.type === 'boss' && e.mode === 'enter')) return;
  e.hp -= dmg; e.flash = 0.08;
  burst(x, y, 4, C.cream, 120, 0.25, 2);
  Sound.hit();
  if (e.hp <= 0) killEnemy(e);
}

function newDust(x, y) { return { type: 'dust', x, y, vx: rand(-45, 45), vy: rand(-70, 10), r: 6, ph: rand(0, TAU) }; }

function dropPower(x, y, chance) {
  if (Math.random() > chance) return;
  const bag = ['shield', 'shield', 'rapid', 'rapid', 'bomb'];
  if (P.lives < 4) bag.push('life');
  pickups.push({ type: pick(bag), x, y, vx: 0, vy: 55, r: 13, ph: rand(0, TAU) });
}

function killEnemy(e) {
  if (e.dead) return;
  e.dead = true; G.kills++;
  addKillCombo();
  const pts = addScore(e.score);
  popup(e.x, e.y - e.r, '+' + fmt(pts), e.type === 'boss' ? C.gold : C.cream, e.type === 'boss' ? 20 : 13);

  const look = {
    drone: [C.teal, '#c9fff6'], asteroid: ['#c3b3f2', '#7d6cb0'], shooter: [C.pink, C.orange],
    scout: [C.cyan, '#a8f0ff'], heavy: ['#9b6bff', C.lav], seeker: [C.orange, C.coral],
    crystal: ['#7ee8ff', C.teal], boss: [C.gold, C.coral]
  }[e.type] || [C.gold, C.coral];
  explode(e.x, e.y, Math.max(14, e.r * 1.1), look[0], look[1]);
  Sound.boom(e.type === 'boss' ? 2 : (e.type === 'shooter' || e.type === 'heavy' || (e.type === 'asteroid' && e.size === 3)) ? 1 : 0);

  let nDust = 0, chance = 0;
  if (e.type === 'drone') { nDust = 2 + (Math.random() < 0.5 ? 1 : 0); chance = 0.05; }
  else if (e.type === 'asteroid') { nDust = [0, 1, 2, 4][e.size]; chance = e.size === 3 ? 0.06 : 0; }
  else if (e.type === 'shooter') { nDust = 5; chance = 0.22; }
  else if (e.type === 'scout') { nDust = 1; chance = 0.04; }
  else if (e.type === 'heavy') { nDust = 4; chance = 0.18; }
  else if (e.type === 'seeker') { nDust = 3; chance = 0.12; }
  else if (e.type === 'crystal') { nDust = 2; chance = 0.08; }
  for (let i = 0; i < nDust; i++) pickups.push(newDust(e.x + rand(-10, 10), e.y + rand(-10, 10)));
  dropPower(e.x, e.y, chance);

  if (e.type === 'asteroid' && e.size > 1) {
    for (const s of [-1, 1]) spawnEnemy('asteroid', { size: e.size - 1, x: e.x + s * e.r * 0.4, y: e.y, vx: s * rand(45, 90) + e.vx * 0.3, vy: e.vy * rand(0.8, 1.2) });
  }
  if (e.type === 'boss') bossDeath(e);
}

function bossDeath(e) {
  G.bossRef = null;
  G.slowT = 1.0;
  bulletsToDust(30);
  for (let i = 0; i < 10; i++) after(i * 0.11, () => { explode(e.x + rand(-60, 60), e.y + rand(-40, 40), rand(20, 40), C.gold, C.coral); Sound.boom(1); });
  after(1.2, () => { explode(e.x, e.y, 70, '#ffffff', C.gold); G.flash = 0.7; addShake(22); Sound.boom(2); });
  for (let i = 0; i < 26; i++) pickups.push(newDust(e.x + rand(-50, 50), e.y + rand(-30, 30)));
  pickups.push({ type: 'life', x: e.x - 30, y: e.y, vx: 0, vy: 55, r: 13, ph: 0 });
  pickups.push({ type: 'bomb', x: e.x + 30, y: e.y, vx: 0, vy: 55, r: 13, ph: 1 });
  showBanner(t('bossDown'), t('points', fmt(3000 * (G.wave / 5) * G.mult)));
}

/* =====================================================================
   Játékos
   ===================================================================== */
const PATTERNS = {
  1: [{ ox: 0, a: 0 }],
  2: [{ ox: -7, a: 0 }, { ox: 7, a: 0 }],
  3: [{ ox: 0, a: 0 }, { ox: -9, a: -0.14 }, { ox: 9, a: 0.14 }],
  4: [{ ox: 0, a: 0 }, { ox: -8, a: -0.12 }, { ox: 8, a: 0.12 }, { ox: -14, a: -0.26 }, { ox: 14, a: 0.26 }]
};

function updatePlayer(dt) {
  const ox = P.x, oy = P.y;
  const ax = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), ay = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
  if (ax || ay) {
    const l = Math.hypot(ax, ay);
    P.x += (ax / l) * 340 * dt; P.y += (ay / l) * 340 * dt;
  } else if (pointer.active) {
    const k = 1 - Math.exp(-16 * dt);
    P.x += (pointer.x - P.x) * k; P.y += (pointer.y - P.y) * k;
  }
  P.x = clamp(P.x, 18, W - 18); P.y = clamp(P.y, 60, H - 92);
  P.vx = (P.x - ox) / dt;
  P.tilt = lerp(P.tilt, clamp(P.vx / 500, -1, 1) * 0.32, 1 - Math.exp(-12 * dt));
  P.thrust = lerp(P.thrust, clamp(-(P.y - oy) / dt / 300, 0, 1), 1 - Math.exp(-10 * dt));

  P.inv = Math.max(0, P.inv - dt);
  P.shield = Math.max(0, P.shield - dt);
  P.rapid = Math.max(0, P.rapid - dt);
  P.muzzle = Math.max(0, P.muzzle - dt);

  P.cool -= dt;
  if (P.cool <= 0) {
    P.cool = (P.weapon === 1 ? 0.24 : 0.21) * (P.rapid > 0 ? 0.55 : 1);
    const pat = PATTERNS[P.weapon];
    for (const s of pat) bullets.push({ x: P.x + s.ox, y: P.y - 16, vx: Math.sin(s.a) * 720, vy: -Math.cos(s.a) * 720, dmg: 1, r: 4 });
    G.shots += pat.length; P.muzzle = 0.06;
    Sound.shoot();
  }
  if (particles.length < MAXP && Math.random() < 0.75) {
    particles.push({ x: P.x + rand(-3, 3), y: P.y + 17, vx: rand(-14, 14), vy: rand(90, 170), life: 0.32, max: 0.32, size: 2.6, color: C.orange, drag: 1 });
  }
  if (G.dustChainT > 0) { G.dustChainT -= dt; if (G.dustChainT <= 0) G.dustChain = 0; }
}

function damagePlayer() {
  if (P.inv > 0 || G.state !== 'play') return false;
  G.hitThisWave = true;
  if (P.shield > 0) {
    P.inv = 0.35; Sound.shieldHit(); addShake(4);
    rings.push({ x: P.x, y: P.y, r: 26, max: 46, life: 0.3, t: 0, color: C.cyan, lw: 3 });
    return true;
  }
  P.lives--; P.inv = 2.4; P.weapon = Math.max(1, P.weapon - 1); G.dustMeter = 0;
  resetCombo();
  G.flash = 0.45; G.flashColor = '#ff5d8f';
  explode(P.x, P.y, 26, C.cream, C.coral);
  Sound.hurt(); addShake(15);
  for (const b of eBullets) burst(b.x, b.y, 3, C.pink, 80, 0.4, 2);
  eBullets = [];
  if (P.lives <= 0) die();
  return true;
}

function die() {
  P.dead = true; G.state = 'dying'; G.dyingT = 1.9; G.slowT = 0.6;
  explode(P.x, P.y, 50, C.cream, C.coral);
  for (let i = 0; i < 6; i++) after(i * 0.12, () => explode(P.x + rand(-24, 24), P.y + rand(-24, 24), rand(14, 26), C.gold, C.coral));
  Sound.over();
  hudHideBanner();
}

function useBomb() {
  if (G.state !== 'play' || P.bombs <= 0) return;
  P.bombs--; Sound.bomb();
  G.bombFx = { t: 0, dur: 0.75, x: P.x, y: P.y };
  G.flash = 0.6; G.flashColor = '#fff1d6'; addShake(20);
  P.inv = Math.max(P.inv, 1.2);
  for (let i = 0; i < enemies.length; i++) { const e = enemies[i]; if (!e.dead) hitEnemy(e, e.type === 'boss' ? 30 : 12, e.x, e.y); }
  bulletsToDust(25);
}

function levelUp() {
  G.dustMeter = 0;
  if (P.weapon < 4) {
    P.weapon++;
    popup(P.x, P.y - 34, t('weaponUp', P.weapon), C.gold, 15);
    Sound.levelUp();
  } else if (P.bombs < 3) {
    P.bombs++;
    popup(P.x, P.y - 34, t('bombPlus'), C.lav, 15);
    Sound.levelUp();
  } else {
    popup(P.x, P.y - 34, '+' + addScore(300, false), C.gold, 15);
    Sound.levelUp();
  }
  rings.push({ x: P.x, y: P.y, r: 20, max: 70, life: 0.5, t: 0, color: C.gold, lw: 3 });
}

function collect(p) {
  p.dead = true;
  if (p.type === 'dust') {
    G.dustChain++; G.dustChainT = 0.6;
    Sound.dust(Math.min(12, G.dustChain));
    addScore(5);
    G.dustMeter++;
    if (G.dustMeter >= need()) levelUp();
    burst(p.x, p.y, 3, C.gold, 60, 0.25, 2);
    return;
  }
  Sound.pickup();
  rings.push({ x: p.x, y: p.y, r: 10, max: 40, life: 0.35, t: 0, color: PK[p.type], lw: 2 });
  if (p.type === 'shield') { P.shield = Math.min(12, P.shield + 8); popup(p.x, p.y - 18, t('shield'), C.cyan, 14); }
  else if (p.type === 'rapid') { P.rapid = Math.min(16, P.rapid + 9); popup(p.x, p.y - 18, t('rapid'), C.orange, 14); }
  else if (p.type === 'bomb') {
    if (P.bombs < 3) { P.bombs++; popup(p.x, p.y - 18, t('bombPlus'), C.lav, 14); }
    else popup(p.x, p.y - 18, '+' + addScore(300, false), C.lav, 14);
  } else if (p.type === 'life') {
    if (P.lives < 5) { P.lives++; popup(p.x, p.y - 18, t('extraLife'), C.pink, 14); }
    else popup(p.x, p.y - 18, '+' + addScore(500, false), C.pink, 14);
  }
}

/* =====================================================================
   Lövedékek, zsákmány, ütközések
   ===================================================================== */
function updateBullets(dt) {
  for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; if (b.y < -20 || b.x < -20 || b.x > W + 20) b.dead = true; }
  for (const b of eBullets) { b.x += b.vx * dt; b.y += b.vy * dt; if (b.y < -30 || b.y > H + 30 || b.x < -30 || b.x > W + 30) b.dead = true; }
}

function updatePickups(dt) {
  for (const p of pickups) {
    if (p.type === 'dust') {
      p.vx *= Math.max(0, 1 - 2 * dt);
      p.vy += (60 - p.vy) * Math.min(1, 2 * dt);
      if (G.state === 'play') {
        const dx = P.x - p.x, dy = P.y - p.y, d = Math.hypot(dx, dy);
        if (d < 135 && d > 0.5) { const pull = (1 - d / 135) * 900 + 120; p.vx += (dx / d) * pull * dt; p.vy += (dy / d) * pull * dt; }
      }
    } else { p.x += Math.sin(clock * 2 + p.ph) * 18 * dt; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.y > H + 30 || p.x < -30 || p.x > W + 30) p.dead = true;
  }
}

function collisions() {
  for (const b of bullets) {
    if (b.dead) continue;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.dead || e.y < -4) continue;
      const dx = b.x - e.x, dy = b.y - e.y, rr = b.r + e.r * 0.92;
      if (dx * dx + dy * dy < rr * rr) { b.dead = true; G.hits++; hitEnemy(e, b.dmg, b.x, b.y); break; }
    }
  }
  if (G.state !== 'play') return;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.dead || e.y < -e.r * 0.5) continue;
    const dx = P.x - e.x, dy = P.y - e.y, rr = P.r + e.r * 0.8;
    if (dx * dx + dy * dy < rr * rr && P.inv <= 0) {
      damagePlayer();
      if (e.type !== 'boss') hitEnemy(e, 4, e.x, e.y);
    }
  }
  for (const b of eBullets) {
    if (b.dead) continue;
    const dx = P.x - b.x, dy = P.y - b.y, d2 = dx * dx + dy * dy, rr = b.r + P.r * 0.75;
    if (d2 < rr * rr) { b.dead = true; burst(b.x, b.y, 4, C.pink, 90, 0.3, 2); damagePlayer(); }
    else if (!b.grazed && d2 < (rr + 15) * (rr + 15)) {
      b.grazed = true; G.graze++; addScore(10, false); Sound.graze();
      burst(b.x, b.y, 2, C.cream, 60, 0.2, 1.6);
    }
  }
  for (const p of pickups) {
    if (p.dead) continue;
    const dx = P.x - p.x, dy = P.y - p.y, rr = P.r + p.r + (p.type === 'dust' ? 10 : 12);
    if (dx * dx + dy * dy < rr * rr) collect(p);
  }
}

function updateWorld(dt) {
  G.time += dt;
  if (G.state === 'play') updatePlayer(dt);
  else { G.dyingT -= dt; if (G.dyingT <= 0) { finishGame(); return; } }
  updateWave(dt);
  updateBullets(dt);
  updateEnemies(dt);
  updatePickups(dt);
  collisions();
  bullets = bullets.filter(b => !b.dead);
  eBullets = eBullets.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead);
  pickups = pickups.filter(p => !p.dead);
  if (G.comboCount > 0) { G.comboTimer -= dt; if (G.comboTimer <= 0) resetCombo(); }
}

/* =====================================================================
   Rajzolás
   ===================================================================== */
function drawPickups() {
  for (const p of pickups) {
    if (p.type === 'dust') {
      ctx.globalCompositeOperation = 'lighter'; drawGlow(p.x, p.y, 11, C.gold, 0.75); ctx.globalCompositeOperation = 'source-over';
      star4(p.x, p.y, 5, clock * 2 + p.ph, C.gold);
      continue;
    }
    const col = PK[p.type], y = p.y + Math.sin(clock * 4 + p.ph) * 2;
    ctx.globalCompositeOperation = 'lighter'; drawGlow(p.x, y, 26, col, 0.45 + 0.2 * Math.sin(clock * 5)); ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#241046'; ctx.beginPath(); ctx.arc(p.x, y, 13, 0, TAU); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
    ctx.save(); ctx.translate(p.x, y); ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 1.8; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (p.type === 'shield') {
      ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(6, -4); ctx.lineTo(6, 1); ctx.bezierCurveTo(6, 5, 3, 7, 0, 8.5); ctx.bezierCurveTo(-3, 7, -6, 5, -6, 1); ctx.lineTo(-6, -4); ctx.closePath();
      ctx.globalAlpha = 0.35; ctx.fill(); ctx.globalAlpha = 1; ctx.stroke();
    } else if (p.type === 'rapid') {
      ctx.beginPath(); ctx.moveTo(2.5, -8); ctx.lineTo(-4.5, 1); ctx.lineTo(0, 1); ctx.lineTo(-2.5, 8); ctx.lineTo(4.5, -2); ctx.lineTo(0, -2); ctx.closePath(); ctx.fill();
    } else if (p.type === 'bomb') {
      ctx.beginPath(); ctx.arc(-1, 2, 5.5, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(2.5, -2); ctx.lineTo(5, -6); ctx.stroke();
      star4(6, -7, 2.6, clock * 8, C.gold);
    } else if (p.type === 'life') {
      ctx.beginPath(); ctx.moveTo(0, 6.5); ctx.bezierCurveTo(-10, 0, -6, -7.5, 0, -3); ctx.bezierCurveTo(6, -7.5, 10, 0, 0, 6.5); ctx.fill();
    }
    ctx.restore();
  }
}

function drawDrone(e) {
  const f = e.flash > 0, r = e.r;
  ctx.fillStyle = f ? '#fff' : '#1f9e9c';
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * r, -2); ctx.lineTo(s * (r + 8), 8); ctx.lineTo(s * (r - 5), 6); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle = f ? '#fff' : '#37c9c4'; ctx.beginPath(); ctx.ellipse(0, 2, r, r * 0.6, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = f ? '#fff' : '#23a3a3'; ctx.beginPath(); ctx.ellipse(0, 5, r * 0.85, r * 0.3, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = f ? '#fff' : '#c9fff6'; ctx.beginPath(); ctx.ellipse(0, -2, r * 0.52, r * 0.44, 0, Math.PI, TAU); ctx.fill();
  const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
  ctx.fillStyle = '#241046'; ctx.beginPath(); ctx.arc(0, -3, 4.3, 0, TAU); ctx.fill();
  ctx.fillStyle = C.pink; ctx.beginPath(); ctx.arc((dx / d) * 1.8, -3 + (dy / d) * 1.8, 1.8, 0, TAU); ctx.fill();
  for (let i = -2; i <= 2; i++) { ctx.fillStyle = (Math.floor(clock * 6 + i) % 2) ? C.gold : C.pink; ctx.beginPath(); ctx.arc(i * r * 0.4, 5.5 - Math.abs(i) * 0.6, 1.5, 0, TAU); ctx.fill(); }
}

function drawAsteroid(e) {
  const f = e.flash > 0;
  const trace = () => { ctx.beginPath(); e.pts.forEach((p, i) => { const x = Math.cos(p.a) * p.r, y = Math.sin(p.a) * p.r; if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }); ctx.closePath(); };
  ctx.rotate(e.rot);
  trace(); ctx.fillStyle = f ? '#fff' : '#7d6cb0'; ctx.fill();
  if (!f) {
    ctx.save(); trace(); ctx.clip();
    ctx.fillStyle = 'rgba(20,8,40,.32)'; ctx.beginPath(); ctx.arc(e.r * 0.4, e.r * 0.45, e.r * 1.05, 0, TAU); ctx.fill();
    for (const c of e.craters) { ctx.fillStyle = 'rgba(36,16,70,.4)'; ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, TAU); ctx.fill(); ctx.strokeStyle = 'rgba(255,241,214,.22)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(c.x - 0.6, c.y - 0.6, c.r, Math.PI * 0.9, Math.PI * 1.85); ctx.stroke(); }
    ctx.restore();
  }
  trace(); ctx.strokeStyle = f ? '#fff' : '#c3b3f2'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
}

function drawShooter(e) {
  const f = e.flash > 0, r = e.r;
  for (const s of [-1, 1]) {
    ctx.fillStyle = f ? '#fff' : '#b5346a';
    ctx.beginPath(); ctx.arc(s * (r + 3), 4, 6.5, 0, TAU); ctx.fill();
    ctx.fillRect(s * (r + 3) - 2, 4, 4, 13);
    ctx.strokeStyle = f ? '#fff' : '#b5346a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(s * r * 0.5, -r * 0.8); ctx.lineTo(s * r * 0.9, -r * 1.35); ctx.stroke();
    ctx.fillStyle = C.gold; ctx.beginPath(); ctx.arc(s * r * 0.9, -r * 1.35, 2.2, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = f ? '#fff' : C.pink; poly(6, r, Math.PI / 6); ctx.fill();
  ctx.fillStyle = f ? '#fff' : '#c93e78'; poly(6, r * 0.66, Math.PI / 6); ctx.fill();
  if (e.charge) { ctx.globalCompositeOperation = 'lighter'; drawGlow(0, 0, 30, C.orange, 0.9); ctx.globalCompositeOperation = 'source-over'; }
  ctx.fillStyle = '#241046'; ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, TAU); ctx.fill();
  ctx.fillStyle = e.charge ? '#fff' : C.gold; ctx.beginPath(); ctx.arc(0, 0, e.charge ? 4 : 3, 0, TAU); ctx.fill();
}

function drawScout(e) {
  const f = e.flash > 0, r = e.r;
  ctx.fillStyle = f ? '#fff' : '#2ec4c9';
  ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * 0.9, r * 0.4); ctx.lineTo(0, r * 0.2); ctx.lineTo(-r * 0.9, r * 0.4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = f ? '#fff' : C.cyan;
  ctx.beginPath(); ctx.moveTo(0, -r * 0.6); ctx.lineTo(r * 0.45, r * 0.15); ctx.lineTo(-r * 0.45, r * 0.15); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#241046'; ctx.beginPath(); ctx.arc(0, -2, 3, 0, TAU); ctx.fill();
  ctx.fillStyle = C.gold; ctx.beginPath(); ctx.arc(0, -2, 1.5, 0, TAU); ctx.fill();
}

function drawHeavy(e) {
  const f = e.flash > 0, r = e.r;
  ctx.fillStyle = f ? '#fff' : '#6b4a9e';
  ctx.beginPath(); ctx.moveTo(0, -r * 0.7); ctx.lineTo(r * 0.95, -r * 0.2); ctx.lineTo(r * 0.7, r * 0.8); ctx.lineTo(-r * 0.7, r * 0.8); ctx.lineTo(-r * 0.95, -r * 0.2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = f ? '#fff' : C.lav;
  ctx.beginPath(); ctx.moveTo(0, -r * 0.4); ctx.lineTo(r * 0.5, 0); ctx.lineTo(r * 0.35, r * 0.5); ctx.lineTo(-r * 0.35, r * 0.5); ctx.lineTo(-r * 0.5, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#241046'; ctx.beginPath(); ctx.arc(0, 2, 7, 0, TAU); ctx.fill();
  ctx.fillStyle = f ? '#fff' : C.pink; ctx.beginPath(); ctx.arc(0, 2, 4, 0, TAU); ctx.fill();
  for (const s of [-1, 1]) {
    ctx.fillStyle = f ? '#fff' : '#8a6bb8';
    ctx.fillRect(s * (r * 0.55) - 4, r * 0.15, 8, 14);
  }
}

function drawSeeker(e) {
  const f = e.flash > 0, r = e.r;
  const ang = Math.atan2(P.y - e.y, P.x - e.x);
  ctx.rotate(ang + Math.PI / 2);
  ctx.fillStyle = f ? '#fff' : C.orange;
  ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * 0.7, r * 0.6); ctx.lineTo(0, r * 0.3); ctx.lineTo(-r * 0.7, r * 0.6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = f ? '#fff' : C.coral;
  ctx.beginPath(); ctx.moveTo(0, -r * 0.5); ctx.lineTo(r * 0.35, r * 0.2); ctx.lineTo(-r * 0.35, r * 0.2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#241046'; ctx.beginPath(); ctx.arc(0, -2, 3.5, 0, TAU); ctx.fill();
  ctx.fillStyle = C.gold; ctx.beginPath(); ctx.arc(0, -2, 1.8, 0, TAU); ctx.fill();
}

function drawCrystal(e) {
  const f = e.flash > 0, r = e.r;
  ctx.rotate(e.rot);
  ctx.fillStyle = f ? '#fff' : '#4ecdc4';
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    ctx.lineTo(Math.cos(a + Math.PI / 4) * r * 0.45, Math.sin(a + Math.PI / 4) * r * 0.45);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = f ? '#fff' : C.cyan; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = f ? '#fff' : '#a8f0ff';
  ctx.beginPath(); ctx.moveTo(0, -r * 0.35); ctx.lineTo(r * 0.25, 0); ctx.lineTo(0, r * 0.35); ctx.lineTo(-r * 0.25, 0); ctx.closePath(); ctx.fill();
}

function drawBoss(e) {
  const f = e.flash > 0, ph = e.phase || 1, v = e.variant || 1;
  if (v === 1) {
    const hull = f ? '#fff' : C.coral, dark = f ? '#fff' : '#c2414f', plate = f ? '#fff' : '#ff9a7a';
    for (const s of [-1, 1]) {
      ctx.save(); ctx.scale(s, 1);
      ctx.fillStyle = dark;
      ctx.beginPath(); ctx.moveTo(44, -8); ctx.lineTo(84, -26); ctx.lineTo(90, 12); ctx.lineTo(66, 30); ctx.lineTo(42, 22); ctx.closePath(); ctx.fill();
      ctx.fillStyle = plate; ctx.beginPath(); ctx.moveTo(56, -6); ctx.lineTo(80, -18); ctx.lineTo(82, 2); ctx.lineTo(58, 8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = dark; ctx.fillRect(28, 32, 13, 28);
      ctx.fillStyle = '#241046'; ctx.fillRect(31, 56, 7, 5);
      ctx.restore();
    }
    ctx.fillStyle = hull; poly(8, 58, Math.PI / 8); ctx.fill();
    ctx.fillStyle = dark; poly(8, 44, Math.PI / 8); ctx.fill();
    ctx.fillStyle = plate; poly(8, 30, Math.PI / 8); ctx.fill();
    const coreCol = ph === 1 ? C.gold : ph === 2 ? C.orange : C.pink;
    ctx.globalCompositeOperation = 'lighter'; drawGlow(0, 0, 44 + Math.sin(clock * 8) * 4, coreCol, 0.75); ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#241046'; ctx.beginPath(); ctx.arc(0, 0, 17, 0, TAU); ctx.fill();
    ctx.fillStyle = f ? '#fff' : coreCol; ctx.beginPath(); ctx.arc(0, 0, 10 + Math.sin(clock * 8) * 1.5, 0, TAU); ctx.fill();
    for (let i = 0; i < 6; i++) { const a = clock * 1.4 + (i / 6) * TAU; ctx.fillStyle = i % 2 ? C.gold : C.cream; ctx.beginPath(); ctx.arc(Math.cos(a) * 38, Math.sin(a) * 38, 2.6, 0, TAU); ctx.fill(); }
  } else if (v === 2) {
    // Twin Core
    const col = f ? '#fff' : C.pink, dark = f ? '#fff' : '#a03060';
    ctx.fillStyle = dark; poly(6, 48, 0); ctx.fill();
    ctx.fillStyle = col; poly(6, 36, 0); ctx.fill();
    for (const sx of [-1, 1]) {
      ctx.fillStyle = f ? '#fff' : C.gold;
      ctx.beginPath(); ctx.arc(sx * 28, 0, 14, 0, TAU); ctx.fill();
      ctx.fillStyle = '#241046'; ctx.beginPath(); ctx.arc(sx * 28, 0, 8, 0, TAU); ctx.fill();
      const core = ph === 3 ? C.coral : C.orange;
      ctx.globalCompositeOperation = 'lighter'; drawGlow(sx * 28, 0, 22, core, 0.7); ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = f ? '#fff' : core; ctx.beginPath(); ctx.arc(sx * 28, 0, 5, 0, TAU); ctx.fill();
    }
  } else if (v === 3) {
    // Spin Fortress
    const col = f ? '#fff' : C.lav, dark = f ? '#fff' : '#5a3a8a';
    ctx.rotate(clock * 0.4);
    ctx.fillStyle = dark; poly(8, 55, 0); ctx.fill();
    ctx.fillStyle = col; poly(8, 42, Math.PI / 8); ctx.fill();
    ctx.fillStyle = dark; poly(8, 28, 0); ctx.fill();
    ctx.globalCompositeOperation = 'lighter'; drawGlow(0, 0, 36, C.lav, 0.6); ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = f ? '#fff' : (ph === 3 ? C.pink : C.gold);
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.fill();
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2;
      ctx.fillStyle = C.cream; ctx.beginPath(); ctx.arc(Math.cos(a) * 38, Math.sin(a) * 38, 5, 0, TAU); ctx.fill();
    }
  } else if (v === 4) {
    // Beam Lancer
    const col = f ? '#fff' : C.orange, dark = f ? '#fff' : '#c45a20';
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.moveTo(0, -50); ctx.lineTo(45, 10); ctx.lineTo(25, 45); ctx.lineTo(-25, 45); ctx.lineTo(-45, 10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0, -35); ctx.lineTo(28, 5); ctx.lineTo(15, 30); ctx.lineTo(-15, 30); ctx.lineTo(-28, 5); ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation = 'lighter'; drawGlow(0, 5, 40, C.gold, 0.65); ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#241046'; ctx.beginPath(); ctx.arc(0, 5, 14, 0, TAU); ctx.fill();
    ctx.fillStyle = f ? '#fff' : (ph === 3 ? C.coral : C.gold); ctx.beginPath(); ctx.arc(0, 5, 8, 0, TAU); ctx.fill();
    for (const s of [-1, 1]) {
      ctx.fillStyle = dark; ctx.fillRect(s * 30 - 5, -15, 10, 40);
      ctx.fillStyle = C.gold; ctx.fillRect(s * 30 - 2, 20, 4, 12);
    }
  } else {
    // Swarm Queen
    const col = f ? '#fff' : C.teal, dark = f ? '#fff' : '#1a7a78';
    ctx.fillStyle = dark; poly(10, 58, clock * 0.2); ctx.fill();
    ctx.fillStyle = col; poly(10, 44, -clock * 0.15); ctx.fill();
    ctx.fillStyle = dark; poly(6, 26, clock * 0.3); ctx.fill();
    ctx.globalCompositeOperation = 'lighter'; drawGlow(0, 0, 40, C.teal, 0.7); ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#241046'; ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.fill();
    ctx.fillStyle = f ? '#fff' : (ph === 3 ? C.pink : C.gold); ctx.beginPath(); ctx.arc(0, 0, 8 + Math.sin(clock * 6) * 1.5, 0, TAU); ctx.fill();
    for (let i = 0; i < 8; i++) {
      const a = clock * 1.2 + i * TAU / 8;
      ctx.fillStyle = i % 2 ? C.cyan : C.cream;
      ctx.beginPath(); ctx.arc(Math.cos(a) * 48, Math.sin(a) * 48, 3.5, 0, TAU); ctx.fill();
    }
  }
}

function drawEnemies() {
  for (const e of enemies) {
    ctx.save(); ctx.translate(e.x, e.y);
    if (e.type === 'drone') drawDrone(e);
    else if (e.type === 'asteroid') drawAsteroid(e);
    else if (e.type === 'shooter') drawShooter(e);
    else if (e.type === 'scout') drawScout(e);
    else if (e.type === 'heavy') drawHeavy(e);
    else if (e.type === 'seeker') drawSeeker(e);
    else if (e.type === 'crystal') drawCrystal(e);
    else drawBoss(e);
    ctx.restore();
  }
}

function drawPlayer() {
  if (P.dead || G.state === 'over') return;
  const sk = currentSkin();
  const blink = P.inv > 0 && P.shield <= 0 && Math.floor(clock * 18) % 2 === 0;
  if (P.shield > 0 && !(P.shield < 2 && Math.floor(clock * 10) % 2 === 0)) {
    ctx.globalCompositeOperation = 'lighter'; drawGlow(P.x, P.y, 46, C.cyan, 0.32); ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = rgba(C.cyan, 0.1); ctx.strokeStyle = rgba(C.cyan, 0.85); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(P.x, P.y, 28 + Math.sin(clock * 6), 0, TAU); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(clock * 0.8); ctx.strokeStyle = rgba(C.cyan, 0.3); ctx.lineWidth = 1; poly(6, 24); ctx.stroke(); ctx.restore();
  }
  // Aura / effekt a festés szerint
  const g = sk.glow;
  if (g && g.charAt(0) === '#') {
    ctx.globalCompositeOperation = 'lighter'; drawGlow(P.x, P.y, 36, g, 0.25 + 0.1 * Math.sin(clock * 4)); ctx.globalCompositeOperation = 'source-over';
  } else if (g === 'solar') {
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(P.x, P.y, 48, '#ffd166', 0.4 + 0.15 * Math.sin(clock * 5));
    drawGlow(P.x, P.y + 6, 28, '#ff6f59', 0.3);
    ctx.globalCompositeOperation = 'source-over';
  } else if (g === 'void') {
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(P.x, P.y, 44, '#b892ff', 0.35);
    drawGlow(P.x, P.y, 22, '#5ee7ff', 0.2 + 0.1 * Math.sin(clock * 3));
    ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(-clock * 1.2);
    ctx.strokeStyle = rgba('#b892ff', 0.35); ctx.lineWidth = 1.5;
    poly(6, 30 + Math.sin(clock * 4) * 3); ctx.stroke();
    ctx.restore(); ctx.globalCompositeOperation = 'source-over';
  } else if (g === 'pulse') {
    const pulse = 0.5 + 0.5 * Math.sin(clock * 6);
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(P.x, P.y, 30 + pulse * 18, '#ff5d8f', 0.2 + pulse * 0.25);
    drawGlow(P.x, P.y, 20, '#ffd166', 0.25);
    ctx.globalCompositeOperation = 'source-over';
  } else if (g === 'rainbow') {
    const hue = (clock * 80) % 360;
    ctx.globalCompositeOperation = 'lighter';
    ctx.save(); ctx.translate(P.x, P.y);
    const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, 44);
    rg.addColorStop(0, 'hsla(' + hue + ',95%,70%,0.5)'); rg.addColorStop(0.5, 'hsla(' + ((hue + 60) % 360) + ',90%,60%,0.25)'); rg.addColorStop(1, 'hsla(' + hue + ',90%,50%,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(0, 0, 44, 0, TAU); ctx.fill();
    ctx.restore(); ctx.globalCompositeOperation = 'source-over';
  } else if (g === 'aurora') {
    ctx.globalCompositeOperation = 'lighter';
    const a1 = (clock * 40) % 360, a2 = (a1 + 120) % 360, a3 = (a1 + 240) % 360;
    drawGlow(P.x + Math.sin(clock * 2) * 8, P.y - 4, 36, '#5ee7ff', 0.28);
    drawGlow(P.x - Math.sin(clock * 2.3) * 8, P.y + 2, 32, '#b892ff', 0.25);
    drawGlow(P.x, P.y - 10, 28, '#7CFFB2', 0.22);
    ctx.save(); ctx.translate(P.x, P.y);
    for (let i = 0; i < 3; i++) {
      const h = [a1, a2, a3][i];
      ctx.strokeStyle = 'hsla(' + h + ',85%,70%,' + (0.2 + 0.1 * Math.sin(clock * 3 + i)) + ')';
      ctx.lineWidth = 1.5; ctx.beginPath();
      ctx.ellipse(0, 0, 26 + i * 6, 18 + i * 4, clock * 0.5 + i, 0, TAU); ctx.stroke();
    }
    ctx.restore(); ctx.globalCompositeOperation = 'source-over';
  } else if (g === 'legend') {
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(P.x, P.y, 50, C.gold, 0.4 + 0.1 * Math.sin(clock * 4));
    drawGlow(P.x, P.y - 10, 32, C.lav, 0.3);
    drawGlow(P.x, P.y + 8, 24, C.coral, 0.22);
    ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(clock * 0.9);
    ctx.strokeStyle = rgba(C.gold, 0.45); ctx.lineWidth = 1.5; poly(8, 34); ctx.stroke();
    ctx.rotate(-clock * 1.6); ctx.strokeStyle = rgba(C.lav, 0.3); poly(6, 28); ctx.stroke();
    ctx.restore(); ctx.globalCompositeOperation = 'source-over';
  }
  // Csillogó szikrák a magasabb festéseknél
  if (sk.spark && particles.length < MAXP && Math.random() < 0.35) {
    const ang = rand(0, TAU), rad = rand(12, 28);
    particles.push({
      x: P.x + Math.cos(ang) * rad, y: P.y + Math.sin(ang) * rad * 0.6,
      vx: rand(-20, 20), vy: rand(-40, -10), life: 0.35, max: 0.35, size: rand(1.2, 2.4),
      color: sk.accent || C.gold, drag: 1.5
    });
  }
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(P.tilt); ctx.globalAlpha = blink ? 0.3 : 1;
  const fl = 10 + P.thrust * 8 + Math.sin(clock * 50) * 2.5;
  ctx.globalCompositeOperation = 'lighter'; drawGlow(0, 19, 16, sk.flame, 0.9); ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = sk.flame; ctx.beginPath(); ctx.moveTo(-5, 11); ctx.lineTo(5, 11); ctx.lineTo(0, 11 + fl * 1.4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = sk.hull; ctx.beginPath(); ctx.moveTo(-2.5, 11); ctx.lineTo(2.5, 11); ctx.lineTo(0, 11 + fl * 0.8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = sk.wing;
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * 8, 2); ctx.lineTo(s * 20, 18); ctx.lineTo(s * 8, 12); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle = sk.hull; ctx.beginPath();
  ctx.moveTo(0, -21); ctx.lineTo(9, -3); ctx.lineTo(14, 13); ctx.lineTo(6, 9); ctx.lineTo(0, 15); ctx.lineTo(-6, 9); ctx.lineTo(-14, 13); ctx.lineTo(-9, -3); ctx.closePath(); ctx.fill();
  // Fénycsík a törzsön
  ctx.fillStyle = sk.flame; ctx.globalAlpha = blink ? 0.3 : 0.85;
  ctx.beginPath(); ctx.moveTo(0, -21); ctx.lineTo(3, -4); ctx.lineTo(0, 9); ctx.lineTo(-3, -4); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = blink ? 0.3 : 1;
  ctx.fillStyle = sk.accent; ctx.beginPath(); ctx.ellipse(0, -5, 3.2, 6, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.ellipse(-1, -7, 1, 2.5, 0, 0, TAU); ctx.fill();
  // Díszítő vonal a szárnyakon (magasabb festések)
  if (sk.cost >= 10000) {
    ctx.strokeStyle = sk.accent; ctx.lineWidth = 1.2; ctx.globalAlpha = blink ? 0.3 : 0.7;
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(s * 9, 4); ctx.lineTo(s * 17, 15); ctx.stroke();
    }
    ctx.globalAlpha = blink ? 0.3 : 1;
  }
  ctx.restore();
  if (P.muzzle > 0) { ctx.globalCompositeOperation = 'lighter'; drawGlow(P.x, P.y - 22, 15, C.gold, 0.9); ctx.globalCompositeOperation = 'source-over'; }
}

function drawBullets() {
  ctx.globalCompositeOperation = 'lighter';
  for (const b of bullets) drawGlow(b.x, b.y, 15, C.gold, 0.55);
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = '#fff8e1'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  for (const b of bullets) { ctx.beginPath(); ctx.moveTo(b.x - b.vx * 0.022, b.y - b.vy * 0.022); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  ctx.globalCompositeOperation = 'lighter';
  for (const b of eBullets) drawGlow(b.x, b.y, b.r * 3, C.pink, 0.6);
  ctx.globalCompositeOperation = 'source-over';
  for (const b of eBullets) {
    ctx.fillStyle = C.pink; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.5, 0, TAU); ctx.fill();
  }
}

function drawFx() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) { const a = p.life / p.max; drawGlow(p.x, p.y, p.size * (1.4 + a * 2.6), p.color, Math.min(1, a * 1.1)); }
  ctx.globalCompositeOperation = 'source-over';
  for (const r of rings) {
    const k = r.t / r.life, e = 1 - Math.pow(1 - k, 3);
    ctx.strokeStyle = rgba(r.color, 1 - k); ctx.lineWidth = r.lw * (1 - k) + 0.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, lerp(r.r, r.max, e), 0, TAU); ctx.stroke();
  }
  if (G.bombFx) {
    const k = G.bombFx.t / G.bombFx.dur, rad = 900 * (1 - Math.pow(1 - k, 2.2));
    ctx.strokeStyle = rgba(C.cream, 1 - k); ctx.lineWidth = 12 * (1 - k) + 2;
    ctx.beginPath(); ctx.arc(G.bombFx.x, G.bombFx.y, rad, 0, TAU); ctx.stroke();
    ctx.strokeStyle = rgba(C.lav, (1 - k) * 0.8); ctx.lineWidth = 6 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(G.bombFx.x, G.bombFx.y, rad * 0.82, 0, TAU); ctx.stroke();
  }
  ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  for (const p of popups) {
    const k = p.t / p.life;
    ctx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
    ctx.font = `800 ${p.size}px Unbounded, system-ui, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,8,40,.75)'; ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

let vignette = null, vigH = 0;
function render() {
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.save();
  if (G.shake > 0.1) { const s = G.shake * (reduceMotion ? 0.2 : 1); ctx.translate(rand(-s, s), rand(-s, s)); }
  drawBackground();
  drawPickups();
  drawEnemies();
  drawPlayer();
  drawBullets();
  drawFx();
  ctx.restore();
  if (G.flash > 0 && !reduceMotion) { ctx.globalAlpha = Math.min(1, G.flash) * 0.5; ctx.fillStyle = G.flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  if (!vignette || vigH !== H) {
    vigH = H; vignette = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.75);
    vignette.addColorStop(0, 'rgba(10,4,25,0)'); vignette.addColorStop(1, 'rgba(10,4,25,.5)');
  }
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);
}

function skinsHTML() {
