    const name = names[sk.id] || ('#' + sk.id);
    // disabled helyett csak CSS + data, hogy érintésen is biztosan működjön a feloldott
    return `<button type="button" class="skin-card${selected ? ' on' : ''}${unlocked ? '' : ' locked'}" data-act="skin" data-skin="${sk.id}" data-unlocked="${unlocked ? '1' : '0'}">
      <span class="skin-swatch" style="background:linear-gradient(135deg,${sk.hull},${sk.wing} 50%,${sk.accent})"></span>
      <b>${name}</b>
      <span>${unlocked ? (selected ? t('skinSelect') : t('skinUse')) : (t('skinLocked') + ' · ' + fmt(sk.cost))}</span>
    </button>`;
  }).join('');
  return `
    <div class="card">
      <h2>${t('skins')}</h2>
      <p class="lead">${t('skinsLead')}</p>
      ${skinProgressHTML()}
      <div class="skin-grid">${cards}</div>
      <button class="btn ghost" data-act="menu">${t('menu')}</button>
    </div>`;
}

function showMenu() {
  reset(); G.state = 'menu';
  hud.hidden = true; stage.classList.remove('playing', 'paused');
  setLangBar(true);
  showScreen(menuHTML());
}

function pauseHTML() {
  return `
    <div class="card">
      <h2>${t('pause')}</h2>
      <p class="lead">${t('pauseInfo', fmt(G.score), G.wave)}</p>
      <button class="btn" data-act="resume">${t('resume')}</button><br>
      <button class="btn ghost" data-act="start">${t('restart')}</button>
      <button class="btn ghost" data-act="menu">${t('menu')}</button>
    </div>`;
}
function showPause() { setLangBar(true); showScreen(pauseHTML()); }

function finishGame() {
  const prevBest = getBest();
  const score = Math.floor(Number(G.score) || 0);
  const savedBest = saveBest(score);
  const isNew = savedBest > prevBest && score >= savedBest;
  store.set('games', (Number(store.get('games', 0)) || 0) + 1);
  store.set('kills', (Number(store.get('kills', 0)) || 0) + (G.kills | 0));
  store.set('skin', selectedSkin);

  const names = t('skinNames');
  const newly = SKINS.filter(sk => sk.cost > 0 && sk.cost > prevBest && sk.cost <= savedBest);
  // Új festés: automatikusan válaszd az utolsó feloldottat, ha még alap van
  if (newly.length && selectedSkin === 0) {
    selectSkin(newly[newly.length - 1].id);
  }
  const next = SKINS.find(sk => sk.cost > savedBest);
  let skinBlock = `<div class="rank">${t('savedRecord', fmt(savedBest))}</div>`;
  if (newly.length) {
    skinBlock += newly.map(sk => `<div class="badge">${t('skinUnlocked', names[sk.id] || sk.id)}</div>`).join('');
  }
  if (next) {
    skinBlock += `<div class="rank">${t('nextSkin', names[next.id] || next.id, fmt(next.cost))}</div>`;
  } else if (savedBest >= SKINS[SKINS.length - 1].cost) {
    skinBlock += `<div class="rank">${t('allSkins')}</div>`;
  }

  G.state = 'over'; G.overAt = performance.now();
  hud.hidden = true; stage.classList.remove('playing', 'paused');
  setLangBar(false);
  const acc = G.shots ? Math.round(100 * G.hits / G.shots) : 0;
  showScreen(`
    <div class="card">
      <h2>${t('over')}</h2>
      <div class="bigscore">${fmt(score)}</div>
      ${isNew ? `<div class="badge">${t('newRecord')}</div>` : `<div class="rank">${t('record')}<b>${fmt(prevBest)}</b></div>`}
      <div class="rank">${t('rank')}<b>${rankOf(score)}</b></div>
      ${skinBlock}
      <div class="grid">
        <div><b>${G.wave}</b><span>${t('gWave')}</span></div>
        <div><b>${fmt(G.kills)}</b><span>${t('gKills')}</span></div>
        <div><b>${acc}%</b><span>${t('gAcc')}</span></div>
        <div><b>${G.maxCombo}</b><span>${t('gCombo')}</span></div>
        <div><b>${G.graze}</b><span>${t('gGraze')}</span></div>
        <div><b>${mmss(G.time)}</b><span>${t('gTime')}</span></div>
      </div>
      <button class="btn" data-act="start">${t('again')}</button>
      <button class="btn ghost" data-act="skins">${t('skins')}</button>
      <button class="btn ghost" data-act="menu">${t('menu')}</button>
    </div>`);
}

/* ---- nyelvváltás (csak menüben és szünetben) ---- */
function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t(n.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(n => { n.setAttribute('aria-label', t(n.dataset.i18nAria)); });
  langBar.querySelectorAll('button[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  const cur = LANG_INFO.find(l => l[0] === lang); if (cur) $('#langCur').textContent = cur[1];
}
function setLangMenu(open) {
  langBar.classList.toggle('open', open);
  $('#langMenu').hidden = !open;
  $('#langToggle').setAttribute('aria-expanded', String(open));
}
function setLang(code) {
  if (!STR[code] || code === lang) return;
  lang = code; store.set('lang', code);
  applyStatic();
  for (const k in hudCache) delete hudCache[k];       // a HUD szövegei újrarajzolódnak
  if (G.state === 'menu') screen.innerHTML = menuHTML();
  else if (G.state === 'paused') { screen.innerHTML = pauseHTML(); updateHUD(); hudHideBanner(); }   // a háttérben látszó HUD is átvált
}
function initLang() {
  $('#langMenu').insertAdjacentHTML('beforeend', LANG_INFO.map(([c, short, name]) =>
    `<button type="button" data-lang="${c}" lang="${c}"><span>${name}</span><b>${short}</b></button>`).join(''));
  applyStatic();
}

function startGame() {
  Sound.init(); Sound.resume();
  try { window.focus(); } catch (err) {}
  tryFullscreen();
  reset();
  G.state = 'play';
  pointer.active = false; activePointerId = null;
  screen.hidden = true; hud.hidden = false; stage.classList.remove('paused'); stage.classList.add('playing');
  setLangBar(false);
  setMuteIcon();
  hudHideBanner();
  startWave(1);
  updateHUD();
  try { history.pushState({ nova: 1 }, ''); } catch (err) {}
}
function pauseGame() {
  if (G.state !== 'play') return;
  G.state = 'paused';
  pointer.active = false; activePointerId = null;
  stage.classList.remove('playing'); stage.classList.add('paused');
  keys.left = keys.right = keys.up = keys.down = false;
  showPause();
}
function resumeGame() {
  if (G.state !== 'paused') return;
  G.state = 'play';
  pointer.active = false; activePointerId = null;
  screen.hidden = true; setLangBar(false);
  stage.classList.remove('paused'); stage.classList.add('playing');
}
function toggleMute() {
  Sound.muted = !Sound.muted; store.set('muted', Sound.muted); Sound.init(); Sound.resume(); setMuteIcon();
  if (!Sound.muted) Sound.ui();
  const link = screen.querySelector('[data-act="mute"]'); if (link) link.textContent = t('sound', Sound.muted);
}

/* =====================================================================
   Bemenet
   ===================================================================== */
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down' };

window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if ((e.code === 'Space' || e.code === 'Enter') && e.target.closest && e.target.closest('#langBar')) return;  // billentyűzettel is váltható
  if (e.code === 'Escape' && langBar.classList.contains('open')) { setLangMenu(false); $('#langToggle').focus(); return; }   // előbb csak a nyelvlista záródik
  const dir = KEYMAP[e.code];
  if (dir) { keys[dir] = true; pointer.active = false; e.preventDefault(); return; }
  if (e.code === 'Space' || e.code === 'KeyB') {
    e.preventDefault();
    if (G.state === 'play') useBomb();
    else if (G.state === 'menu' && e.code === 'Space') startGame();
    else if (G.state === 'over' && performance.now() - G.overAt > 600 && e.code === 'Space') startGame();
    else if (G.state === 'paused' && e.code === 'Space') resumeGame();
    return;
  }
  if (e.code === 'Enter') {
    if (G.state === 'menu') { e.preventDefault(); startGame(); }
    else if (G.state === 'over' && performance.now() - G.overAt > 600) { e.preventDefault(); startGame(); }
    else if (G.state === 'paused') { e.preventDefault(); resumeGame(); }
    return;
  }
  if (e.code === 'KeyP' || e.code === 'Escape') { if (G.state === 'play') pauseGame(); else if (G.state === 'paused') resumeGame(); return; }
  if (e.code === 'KeyM') toggleMute();
});
window.addEventListener('keyup', e => {
  const dir = KEYMAP[e.code]; if (dir) keys[dir] = false;
  if (e.code === 'Space' && !(e.target.closest && e.target.closest('#langBar'))) e.preventDefault();
});
window.addEventListener('blur', () => { keys.left = keys.right = keys.up = keys.down = false; pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); else Sound.resume(); });
window.addEventListener('pagehide', () => pauseGame());

/* Érintés: a hajó a hüvelykujj fölött legyen, ne takarja ki a játékteret */
const TOUCH_Y_OFFSET = TOUCH ? 90 : 0;
let activePointerId = null;

function setPointer(e) {
  const r = canvas.getBoundingClientRect();
  if (!(r.width > 0 && r.height > 0)) return;
  pointer.x = (e.clientX - r.left) / r.width * W;
  pointer.y = (e.clientY - r.top) / r.height * H - (e.pointerType === 'mouse' ? 0 : TOUCH_Y_OFFSET);
  pointer.active = true;
}
function clearPointer(e) {
  if (e && activePointerId != null && e.pointerId !== activePointerId) return;
  activePointerId = null;
  pointer.active = false;
}
stage.addEventListener('pointerdown', e => {
  Sound.init(); Sound.resume();
  if (G.state !== 'play' || e.target.closest('button')) return;
  activePointerId = e.pointerId;
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  setPointer(e);
  e.preventDefault();
});
stage.addEventListener('pointermove', e => {
  if (G.state !== 'play' || e.target.closest('button')) return;
  if (activePointerId != null && e.pointerId !== activePointerId) return;
  setPointer(e);
});
stage.addEventListener('pointerup', clearPointer);
stage.addEventListener('pointercancel', clearPointer);
stage.addEventListener('lostpointercapture', clearPointer);

/* Menü: click + touch (iOS-en a click néha késik) */
function handleScreenAct(e) {
  const a = e.target.closest('[data-act]'); if (!a) return;
  Sound.init(); Sound.resume();
  const act = a.dataset.act;
  if (act === 'start') startGame();
  else if (act === 'resume') resumeGame();
  else if (act === 'menu') {
    // szünetből menübe: mentsük a rekordot, ha jobb
    if (G.state === 'paused' || G.state === 'over' || G.state === 'play') saveBest(G.score);
    showMenu();
  }
  else if (act === 'mute') toggleMute();
  else if (act === 'skins') {
    if (G.state === 'over' || G.state === 'paused') saveBest(G.score);
    showScreen(skinsHTML());
  }
  else if (act === 'skin') {
    const id = Number(a.dataset.skin);
    if (a.dataset.unlocked === '1' || skinUnlocked(id)) {
      if (selectSkin(id)) {
        Sound.ui();
        showScreen(skinsHTML());
      }
    }
  }
}
screen.addEventListener('click', handleScreenAct);
langBar.addEventListener('click', e => {
  if (G.state !== 'menu' && G.state !== 'paused') return;
  Sound.init(); Sound.resume();
  if (e.target.closest('#langToggle')) { e.target.closest('#langToggle').blur(); setLangMenu(!langBar.classList.contains('open')); Sound.ui(); return; }   // 1 gomb nyitja és zárja a listát
  const b = e.target.closest('button[data-lang]'); if (!b) return;
  b.blur();
  if (b.dataset.lang !== lang) { setLang(b.dataset.lang); Sound.ui(); }
  setLangMenu(false);
});
document.addEventListener('pointerdown', e => { if (langBar.classList.contains('open') && !e.target.closest('#langBar')) setLangMenu(false); }, true);
$('#btnPause').addEventListener('click', e => { e.currentTarget.blur(); pauseGame(); });
el.btnMute.addEventListener('click', e => { e.currentTarget.blur(); toggleMute(); });
el.btnBomb.addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation();
  Sound.init(); Sound.resume();
  useBomb();
});

/* ---- Android + iOS mobil kiegészítések ---- */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t =>
  document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });
document.addEventListener('wheel', e => { e.preventDefault(); }, { passive: false });
document.body.addEventListener('scroll', () => { window.scrollTo(0, 0); }, { passive: true });
window.addEventListener('scroll', () => { if (window.scrollY || window.scrollX) window.scrollTo(0, 0); }, { passive: true });
stage.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchstart', () => {}, { passive: true });
// Dupla koppintás nagyítás tiltása
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = performance.now();
  if (now - lastTouchEnd < 320) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

// Hang feloldása (iOS Safari + Android Chrome)
const AUDIO_EVENTS = ['touchend', 'pointerup', 'click', 'keydown'];
function unlockAudio() {
  Sound.init();
  const c = Sound.ctx; if (!c) return;
  const done = () => { if (c.state === 'running') AUDIO_EVENTS.forEach(t => window.removeEventListener(t, unlockAudio, true)); };
  try {
    if (c.state !== 'running') { const p = c.resume(); if (p && p.then) p.then(done, () => {}); }
    const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0);
  } catch (err) {}
  done();
}
AUDIO_EVENTS.forEach(t => window.addEventListener(t, unlockAudio, { capture: true, passive: true }));

// Android vissza gomb: szünet / menü
window.addEventListener('popstate', () => {
  if (G.state === 'play') { history.pushState({ nova: 1 }, ''); pauseGame(); }
  else if (G.state === 'paused') { history.pushState({ nova: 1 }, ''); resumeGame(); }
  else if (G.state === 'over') { history.pushState({ nova: 1 }, ''); showMenu(); }
});
try { history.pushState({ nova: 1 }, ''); } catch (err) {}

// Teljes képernyő (Android Chrome) – opcionális, játék indításakor
function tryFullscreen() {
  if (!TOUCH) return;
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
  if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
    try { const p = req.call(el); if (p && p.catch) p.catch(() => {}); } catch (err) {}
  }
}

/* =====================================================================
   Főciklus
   ===================================================================== */
let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  let dt = (ts - lastTs) / 1000; lastTs = ts;
  if (!(dt > 0)) dt = 0.016;
  dt = Math.min(dt, 0.05);
  if (G.state !== 'paused') {
    if (G.slowT > 0) { G.slowT -= dt; dt *= 0.35; }
    clock += dt;
    if (G.state === 'menu') { P.y = H - 150 + Math.sin(clock * 1.6) * 6; P.x = W / 2 + Math.sin(clock * 0.8) * 14; P.tilt = Math.cos(clock * 0.8) * 0.06; P.thrust = 0.3; if (Math.random() < 0.7) particles.push({ x: P.x + rand(-3, 3), y: P.y + 17, vx: rand(-14, 14), vy: rand(90, 170), life: 0.32, max: 0.32, size: 2.6, color: C.orange, drag: 1 }); }
    updateBackground(dt);
    if (G.state === 'play' || G.state === 'dying') updateWorld(dt);
    updateFx(dt);
  }
  render();
  if (G.state === 'play' || G.state === 'dying') updateHUD();
}

window.addEventListener('resize', scheduleResize);
// iOS-en az orientationchange pillanatában a méretek még a régiek, ezért késleltetve is újraszámolunk
window.addEventListener('orientationchange', () => { scheduleResize(); setTimeout(resize, 120); setTimeout(resize, 400); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleResize);
if (window.ResizeObserver) new ResizeObserver(scheduleResize).observe(document.body);
reset();
resize();
setMuteIcon();
initLang();
showMenu();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
